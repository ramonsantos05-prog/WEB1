<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cadastro de Usuários</h1>
    </header>

    <main>

        <section>
            <h2>Bem-vindo!</h2>

            <p>
                Esta página foi criada para realizar o cadastro de novos usuários.
            </p>

            <img  id="imgPreferencia"
                src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
                alt="Pessoas utilizando computadores"
            >
        </section>

        <section>
            <h2>Faça seu cadastro</h2>

            <form id="formCadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <label for="profissao">Link da profissão preferida:</label>
                <input 
                    type="url" 
                    id="profissao" 
                    name="profissao"
                    placeholder="https://exemplo.com"
                    required
                >

                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section id="sectionDados">
            <h2>Dados cadastrados:</h2>
        </section>

    </main>

    <footer>
        <p>© 2026 - Página de Cadastro</p>
    </footer>

</body>

</html>
